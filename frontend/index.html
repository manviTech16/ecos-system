<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ECOS — Enterprise Collaboration Optimization System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>

</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;
/* ---------- API client: talks to the ECOS backend (server.py) ---------- */
const BASE_URL=location.protocol==="file:"?"http://localhost:8000":"";
const api=(path,body,method)=>fetch(BASE_URL+path,{method:method||(body?"POST":"GET"),headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(async r=>{
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=j.error||{},d=e.details;let x="";if(d&&Array.isArray(d.violations))x=": "+d.violations.join("; ");else if(d&&typeof d==="object")x=": "+Object.entries(d).filter(([k,v])=>typeof v==="string").map(([k,v])=>k+" "+v).join("; ");throw new Error((e.message||("Request failed ("+r.status+")"))+x)}
 return j});
let GOTO=()=>{},REPORT_EMP=null;
let TODAY="2026-10-22",D,employees,EM,PN,tasks,TM,assigns,asgT,asgE,resources,projects,comms,meets,deps,constraints,consByTask,rank,score,RELOAD=()=>{};
const by=(a,k)=>Object.fromEntries(a.map(x=>[x[k],x]));
const pad=(n,l)=>String(n).padStart(l,"0");
const sp=v=>String(v==null?"":v).split(",").map(x=>x.trim()).filter(Boolean);
const sumBy=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const days=d=>Math.round((new Date(d)-new Date(TODAY))/864e5);
const grp=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m)};
const PR={Critical:0,High:1,Medium:2,Low:3};
const topic=t=>/deadline|sprint/i.test(t)?"Schedule":/compute|resource/i.test(t)?"Resources":/blocked|unavailable/i.test(t)?"Blocker":/scope|requirement/i.test(t)?"Requirements":/Python|employee/i.test(t)?"Staffing":/Deployment|ready for testing/i.test(t)?"Release":/meeting|review/i.test(t)?"Coordination":"General";
function buildModel(D){
const employees=D.Employees.map(e=>({id:e.Employee_ID,name:e.Employee_Name,dept:e.Department,role:e.Role,skills:sp(e.Skills),exp:+e.Experience_Years,hours:+e.Availability_Hours_Per_Day,avail:Math.round(e.Availability_Hours_Per_Day/9*100),workload:+e.Current_Workload_Percent,perf:+e.Performance_Score,team:e.Team_ID,mode:e.Work_Mode}));
const EM=by(employees,"id");
const PN=Object.fromEntries(D.Projects.map(p=>[p.Project_ID,p.Project_Name]));
const tasks=D.Tasks.map(t=>({id:t.Task_ID,pid:t.Project_ID,project:PN[t.Project_ID]||t.Project_ID,name:t.Task_Name,skills:sp(t.Required_Skills),priority:t.Priority,hours:+t.Estimated_Hours,deadline:String(t.Deadline),dep:t.Dependency_Task_ID||"None",req:+t.Required_Employees,status:t.Status,dept:t.Department}));
const TM=by(tasks,"id");
const assigns=D.Assignments.map(a=>({id:a.Assignment_ID,emp:a.Employee_ID,task:a.Task_ID,match:+a.Skill_Match_Score,av:+a.Availability_Score,wf:+a.Workload_Factor,score:+a.Assignment_Score,status:a.Assignment_Status}));
const asgT={},asgE={};assigns.forEach(a=>{(asgT[a.task]=asgT[a.task]||[]).push(a);(asgE[a.emp]=asgE[a.emp]||[]).push(a)});
const resources=D.Resources.map(r=>({id:r.Resource_ID,name:r.Resource_Name,type:r.Resource_Type,cap:+r.Capacity,util:+r.Utilization_Percent,status:r.Availability_Status,pid:r.Project_ID,project:PN[r.Project_ID]||r.Project_ID}));
const projects=D.Projects.map(p=>{const ts=tasks.filter(t=>t.pid===p.Project_ID),dn=ts.filter(t=>t.status==="Completed").length;return{id:p.Project_ID,name:p.Project_Name,dept:p.Primary_Department,priority:p.Priority,status:p.Status,team:+p.Team_Size,deadline:String(p.Target_Completion_Date),progress:ts.length?Math.round(dn/ts.length*100):0,tasks:ts.length}});
const comms=D.Communications.map(m=>({id:m.Message_ID,from:(EM[m.Sender_ID]||{}).name||m.Sender_ID,to:(EM[m.Receiver_ID]||{}).name||m.Receiver_ID,pid:m.Project_ID,project:PN[m.Project_ID]||m.Project_ID,type:m.Communication_Type,text:m.Message_Text,ts:String(m.Timestamp),priority:m.Priority,action:m.Action_Required}));
const meets=D.Meetings.map(m=>({id:m.Meeting_ID,pid:m.Project_ID,project:PN[m.Project_ID]||m.Project_ID,topic:m.Topic,people:sp(m.Participants),summary:m.Discussion_Summary,decisions:m.Decisions,items:m.Action_Items,date:String(m.Meeting_Date)}));
const deps=D.Task_Dependencies.map(d=>({id:d.Dependency_ID,pre:d.Predecessor_Task_ID,suc:d.Successor_Task_ID,type:d.Dependency_Type}));
/* CSP: a constraint is checked against the task's currently Assigned employees */
const evalC=(c,emps,t)=>{const v=String(c.value),n=parseFloat(v.replace(/\D+/g," ").trim())||0;
 switch(c.type){
 case"Required Skill":return emps.every(e=>e.skills.includes(v));
 case"Minimum Experience":return emps.every(e=>e.exp>=n);
 case"Maximum Workload":return emps.every(e=>e.workload<=n);
 case"Availability":return emps.every(e=>e.hours>=5);
 case"Working Hours":return emps.every(e=>e.hours<=n);
 case"Department Match":return emps.every(e=>e.dept===t.dept);
 case"Deadline":return t.status==="Completed"||t.deadline>=TODAY;
 case"Task Dependency":return t.dep==="None"||!TM[t.dep]||TM[t.dep].status==="Completed";
 case"Team Capacity":return emps.every(e=>(asgE[e.id]||[]).filter(a=>a.status==="Assigned").length<=n);
 case"Resource Availability":{const rs=resources.filter(r=>r.pid===t.pid);return !(rs.length&&rs.every(r=>r.status==="Unavailable"))}
 default:return true}};
const constraints=D.Constraints.map(c=>{const o={id:c.Constraint_ID,task:c.Task_ID,type:c.Constraint_Type,value:c.Constraint_Value,level:c.Constraint_Level},t=TM[o.task];
 const em=(asgT[o.task]||[]).filter(a=>a.status==="Assigned").map(a=>EM[a.emp]).filter(Boolean);
 o.status=!t||evalC(o,em,t)?"Satisfied":"Violated";return o});
const consByTask={};constraints.forEach(c=>(consByTask[c.task]=consByTask[c.task]||[]).push(c));
const passes=(t,e)=>(consByTask[t.id]||[]).filter(c=>c.level==="Hard").every(c=>evalC(c,[e],t));
const score=(e,t)=>{const m=Math.round(100*t.skills.filter(k=>e.skills.includes(k)).length/Math.max(1,t.skills.length));const wl=Math.max(0,100-e.workload*2);return{match:m,score:Math.round(.4*m+.25*e.avail+.2*wl+.15*e.perf)}};
const rank=t=>employees.map(e=>({e,...score(e,t),ok:passes(t,e)})).sort((a,b)=>(b.ok-a.ok)||(b.score-a.score)).slice(0,6);

return {employees,EM,PN,tasks,TM,assigns,asgT,asgE,resources,projects,comms,meets,deps,constraints,consByTask,rank,score};
}
function load(raw){D=raw;TODAY=raw.today||TODAY;({employees,EM,PN,tasks,TM,assigns,asgT,asgE,resources,projects,comms,meets,deps,constraints,consByTask,rank,score}=buildModel(raw))}
/* ---------- UI primitives ---------- */
const Ic=({d,c="w-5 h-5"})=><svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const Logo=()=><svg viewBox="0 0 32 32" className="w-8 h-8"><rect width="32" height="32" rx="9" fill="#4f46e5"/><g stroke="#fff" strokeWidth="1.8"><path d="M16 9 9 21M16 9l7 12M9 21h14"/></g><g fill="#fff"><circle cx="16" cy="9" r="3"/><circle cx="9" cy="21" r="3"/><circle cx="23" cy="21" r="3"/></g></svg>;
const COL={Critical:"bg-rose-50 text-rose-700",High:"bg-orange-50 text-orange-700",Medium:"bg-amber-50 text-amber-700",Low:"bg-emerald-50 text-emerald-700",Pending:"bg-slate-100 text-slate-600","In Progress":"bg-indigo-50 text-indigo-700",Completed:"bg-emerald-50 text-emerald-700",Blocked:"bg-rose-50 text-rose-700","On track":"bg-emerald-50 text-emerald-700","At risk":"bg-amber-50 text-amber-700",Delayed:"bg-rose-50 text-rose-700",Active:"bg-emerald-50 text-emerald-700","On leave":"bg-slate-100 text-slate-600",Satisfied:"bg-emerald-50 text-emerald-700",Violated:"bg-rose-50 text-rose-700",Hard:"bg-indigo-50 text-indigo-700",Soft:"bg-slate-100 text-slate-600"};
const Badge=({v})=><span className={"inline-block px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap "+(COL[v]||"bg-slate-100 text-slate-600")}>{v}</span>;
const Load=({v})=>{const [t,c]=v<15?["Low","bg-emerald-50 text-emerald-700"]:v<28?["Medium","bg-amber-50 text-amber-700"]:["High","bg-rose-50 text-rose-700"];return <span className={"inline-block px-2 py-0.5 rounded-full text-xs font-semibold "+c}>{t} · {v}%</span>};
const Bar=({v,c="bg-indigo-500"})=><div className="h-2 rounded-full bg-slate-100 w-full"><div className={"h-2 rounded-full "+c} style={{width:v+"%"}}/></div>;
const Page=({title,sub,children,right})=><div><div className="flex flex-wrap items-end justify-between gap-3 mb-5"><div><h1 className="text-2xl font-extrabold tracking-tight">{title}</h1><p className="text-slate-500 text-sm mt-1">{sub}</p></div>{right}</div>{children}</div>;
const Kpi=({l,v,n,tone})=><div className="card p-4"><div className="text-sm text-slate-500 font-medium">{l}</div><div className="text-3xl font-extrabold mt-1">{v}</div><div className={"text-xs mt-1 font-semibold "+(tone||"text-emerald-600")}>{n}</div></div>;
const inp="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300";
function Table({cols,rows,onRow,size=10}){
 const [q,setQ]=useState(""),[sk,setSk]=useState(null),[asc,setAsc]=useState(true),[pg,setPg]=useState(0);
 const [fl,setFl]=useState({});
 const filt=useMemo(()=>{let x=rows.filter(o=>cols.every(c=>!fl[c.k]||String(c.f?c.f(o):o[c.k])===fl[c.k]));if(q)x=x.filter(o=>JSON.stringify(o).toLowerCase().includes(q.toLowerCase()));if(sk)x=[...x].sort((a,b)=>(a[sk]>b[sk]?1:-1)*(asc?1:-1));return x},[rows,q,sk,asc,fl]);
 useEffect(()=>setPg(0),[q,fl]);
 const pages=Math.max(1,Math.ceil(filt.length/size)),view=filt.slice(pg*size,pg*size+size);
 return <div className="card overflow-hidden"><div className="p-3 flex flex-wrap gap-2 border-b border-slate-100">
  <input className={inp+" w-full sm:w-64"} placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}/>
  {cols.filter(c=>c.filter).map(c=><select key={c.k} className={inp} value={fl[c.k]||""} onChange={e=>setFl({...fl,[c.k]:e.target.value})}><option value="">{c.h}: all</option>{[...new Set(rows.map(o=>c.f?c.f(o):o[c.k]))].sort().map(v=><option key={v}>{v}</option>)}</select>)}</div>
  <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="text-left text-slate-500 bg-slate-50">{cols.map(c=><th key={c.k} className="th px-3 py-2.5 font-semibold whitespace-nowrap" onClick={()=>{setSk(c.k);setAsc(sk===c.k?!asc:true)}}>{c.h}{sk===c.k?(asc?" ↑":" ↓"):""}</th>)}</tr></thead>
  <tbody>{view.map(o=><tr key={o.id} onClick={()=>onRow&&onRow(o)} className="border-t border-slate-100 hover:bg-indigo-50/40 cursor-pointer">{cols.map(c=><td key={c.k} className="px-3 py-2.5 whitespace-nowrap">{c.r?c.r(o):o[c.k]}</td>)}</tr>)}</tbody></table>
  {!view.length&&<div className="p-10 text-center text-slate-500 text-sm">No records match these filters. Clear a filter to see results.</div>}</div>
  <div className="p-3 flex items-center justify-between text-sm text-slate-500 border-t border-slate-100"><span>{filt.length} records</span><div className="flex items-center gap-2"><button disabled={pg===0} onClick={()=>setPg(pg-1)} className="px-2 py-1 rounded border disabled:opacity-40">Prev</button><span>{pg+1} / {pages}</span><button disabled={pg>=pages-1} onClick={()=>setPg(pg+1)} className="px-2 py-1 rounded border disabled:opacity-40">Next</button></div></div></div>}
const Panel=({title,onClose,children})=><div className="fixed inset-0 z-40 flex justify-end" role="dialog"><div className="absolute inset-0 bg-slate-900/30" onClick={onClose}/><div className="panel relative w-full max-w-md bg-white h-full overflow-y-auto p-5 shadow-2xl"><div className="flex justify-between items-start mb-4"><h2 className="text-lg font-extrabold">{title}</h2><button onClick={onClose} aria-label="Close" className="text-slate-400 hover:text-slate-700 text-xl leading-none">×</button></div>{children}</div></div>;
const Row=({l,children})=><div className="flex justify-between gap-3 py-2 border-b border-slate-100 text-sm"><span className="text-slate-500">{l}</span><span className="font-semibold text-right">{children}</span></div>;
const Ring=({v,size=120})=>{const R=size/2-10,C=2*Math.PI*R;return <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={R} stroke="#e8ebf5" strokeWidth="10" fill="none"/><circle cx={size/2} cy={size/2} r={R} stroke="#4f46e5" strokeWidth="10" fill="none" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-v/100)} transform={`rotate(-90 ${size/2} ${size/2})`}/><text x="50%" y="52%" textAnchor="middle" dominantBaseline="middle" fontSize={size/3.2} fontWeight="800" fill="#14213d">{v}</text></svg>};
/* ---------- Pages ---------- */
const Dist=({title,data,unit=""})=>{const mx=Math.max(1,...data.map(d=>d[1]));return <div className="card p-5"><h3 className="font-bold mb-3">{title}</h3><div className="space-y-2.5">{data.map(([l,v,c])=><div key={l}><div className="flex justify-between text-xs mb-1"><span className="text-slate-600">{l}</span><b>{v}{unit}</b></div><div className="h-2 rounded-full bg-slate-100"><div className="h-2 rounded-full" style={{width:v/mx*100+"%",background:c||"#4f46e5"}}/></div></div>)}</div></div>};
const Chips=({a})=><div className="flex flex-wrap gap-2">{a.map(k=><span key={k} className="px-2 py-1 rounded-md bg-indigo-50 text-indigo-700 text-xs font-semibold">{k}</span>)}</div>;
const H4=({children})=><h4 className="font-bold mt-5 mb-2 text-sm">{children}</h4>;
const Mini=({rows})=>rows.length?rows.map(r=><div key={r[0]} className="flex justify-between gap-3 text-sm py-2 border-b border-slate-100"><span>{r[1]}</span>{r[2]}</div>):<div className="text-sm text-slate-500 py-2">None on record.</div>;
function Dashboard(){
 const cnt=k=>tasks.filter(t=>t.status===k).length,pend=cnt("Pending"),prog=cnt("In Progress"),done=cnt("Completed"),blk=cnt("Blocked");
 const avg=Math.round(sumBy(employees,e=>e.workload)/employees.length);
 const live=assigns.filter(a=>a.status!=="Rejected"),opt=Math.round(sumBy(live,a=>a.score)/live.length);
 const open=tasks.filter(t=>t.status!=="Completed"),soon=open.filter(t=>days(t.deadline)>=0&&days(t.deadline)<=14).length;
 const under=employees.filter(e=>e.workload<15).length;
 const bad=new Set(constraints.filter(c=>c.status==="Violated"&&c.level==="Hard").map(c=>c.task));
 const hiRisk=open.filter(t=>(t.priority==="Critical"||t.priority==="High")&&bad.has(t.id)).length;
 const better=assigns.filter(a=>a.status==="Suggested"&&a.score>=85).length;
 const segs=[["Pending",pend,"#94a3b8"],["In Progress",prog,"#4f46e5"],["Completed",done,"#10b981"],["Blocked",blk,"#f43f5e"]];
 const bins=Array.from({length:8},(_,i)=>employees.filter(e=>e.workload>=5+i*5&&e.workload<10+i*5+(i===7?1:0)).length),mx=Math.max(1,...bins);
 const ins=[soon+" open tasks are due within 14 days.",under+" employees are below 15% workload.",hiRisk+" high-priority tasks have unresolved hard-constraint violations.",better+" suggested assignments score 85 or higher and are ready to apply."];
 const top=projects.filter(p=>p.status==="Active").sort((a,b)=>PR[a.priority]-PR[b.priority]||a.deadline.localeCompare(b.deadline)).slice(0,5);
 return <Page title="Good morning, Manvi" sub="Here's your organization's collaboration overview.">
 <div className="card p-4 mb-4 flex flex-wrap items-center gap-2 text-sm bg-gradient-to-r from-indigo-50 to-white">{["Tasks","Candidate employees","Heuristic scoring","Constraint validation","Optimal assignment"].map((x,i)=><React.Fragment key={x}>{i>0&&<span className="text-indigo-400">›</span>}<span className="font-semibold text-indigo-900">{x}</span></React.Fragment>)}<span className="text-slate-500 ml-auto hidden md:inline">Heuristic search + CSP recommend better assignments.</span></div>
 <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4"><Kpi l="Total Employees" v={employees.length} n={D.Departments.length+" departments"} tone="text-slate-500"/><Kpi l="Active Projects" v={projects.filter(p=>p.status==="Active").length} n={"of "+projects.length+" projects"} tone="text-slate-500"/><Kpi l="Pending Tasks" v={pend} n={"of "+tasks.length+" total"} tone="text-amber-600"/><Kpi l="Available Resources" v={resources.filter(r=>r.status==="Available").length} n={"of "+resources.length+" resources"} tone="text-slate-500"/>
 <Kpi l="Tasks Completed" v={done} n={Math.round(done/tasks.length*100)+"% of all tasks"}/><Kpi l="High Priority Tasks" v={open.filter(t=>t.priority==="Critical"||t.priority==="High").length} n="Open and not completed" tone="text-rose-600"/><Kpi l="Avg Employee Workload" v={avg+"%"} n={"Across "+employees.length+" employees"} tone="text-slate-500"/><Kpi l="Optimization Score" v={opt} n="Mean score of live assignments"/></div>
 <div className="grid lg:grid-cols-3 gap-4 mb-4">
 <div className="card p-5 lg:col-span-2"><h3 className="font-bold mb-4">Task Optimization Overview</h3><div className="flex flex-wrap items-center gap-8"><svg width="170" height="170" viewBox="0 0 170 170">{(()=>{let o=0;const R=65,C=2*Math.PI*R;return segs.map(([n,v,c])=>{const l=v/tasks.length*C,el=<circle key={n} cx="85" cy="85" r={R} fill="none" stroke={c} strokeWidth="22" strokeDasharray={l+" "+(C-l)} strokeDashoffset={-o} transform="rotate(-90 85 85)"/>;o+=l;return el})})()}<text x="85" y="82" textAnchor="middle" fontSize="26" fontWeight="800" fill="#14213d">{tasks.length}</text><text x="85" y="102" textAnchor="middle" fontSize="11" fill="#64748b">tasks</text></svg>
 <div className="flex-1 min-w-[200px] space-y-3">{segs.map(([n,v,c])=><div key={n}><div className="flex justify-between text-sm mb-1"><span className="flex items-center gap-2"><i className="w-2.5 h-2.5 rounded-full" style={{background:c}}/>{n}</span><b>{v}</b></div><div className="h-2 rounded-full bg-slate-100"><div className="h-2 rounded-full" style={{width:v/tasks.length*100+"%",background:c}}/></div></div>)}</div></div></div>
 <div className="card p-5"><h3 className="font-bold mb-3">AI Insights</h3><ul className="space-y-3">{ins.map(x=><li key={x} className="flex gap-2 text-sm"><span className="mt-1.5 w-2 h-2 rounded-full bg-indigo-500 shrink-0"/>{x}</li>)}</ul></div></div>
 <div className="grid lg:grid-cols-3 gap-4"><div className="card p-5"><h3 className="font-bold mb-1">Employee Workload</h3><p className="text-xs text-slate-500 mb-3">Employees per workload band (%)</p><svg viewBox="0 0 240 130" className="w-full">{bins.map((b,i)=><g key={i}><rect x={i*30+4} y={105-b/mx*95} width="22" height={b/mx*95} rx="4" fill={i<2?"#10b981":i<5?"#f59e0b":"#f43f5e"}/><text x={i*30+15} y="120" fontSize="9" textAnchor="middle" fill="#64748b">{5+i*5}</text><text x={i*30+15} y={101-b/mx*95} fontSize="9" textAnchor="middle" fill="#14213d">{b}</text></g>)}</svg></div>
 <div className="card p-5 lg:col-span-2 overflow-x-auto"><h3 className="font-bold mb-3">Project Progress</h3><table className="w-full text-sm"><tbody>{top.map(p=><tr key={p.id} className="border-t border-slate-100"><td className="py-2.5 pr-3 font-semibold whitespace-nowrap">{p.name}</td><td className="w-32 pr-3"><Bar v={p.progress}/></td><td className="pr-3">{p.progress}%</td><td className="pr-3"><Badge v={p.priority}/></td><td className="pr-3 text-slate-500 whitespace-nowrap">{p.deadline}</td><td><Badge v={p.status}/></td></tr>)}</tbody></table></div></div></Page>}
function Employees(){
